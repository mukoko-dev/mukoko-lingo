name: Release

# Releasing is a merge to main; nobody pushes a tag by hand. When CI passes
# on a push to main, this reads the version from package.json and, if
# `v<version>` is not tagged yet, tags the CI-validated commit and publishes
# a GitHub release, using the RELEASE_BUMP_TOKEN org secret. A merge that
# does not change the version finds its tag already there and does nothing.
#
# Versioning policy (nyuchi/.github#80): a release to main is the next
# MINOR above the highest tag, and package.json must say so (the run fails
# and names the right version otherwise); merges into staging are tagged as
# patches by staging-version.yml; a MAJOR only by hand, from the Actions tab
# with bump: major. Each segment holds 0..999.
#
# The version files and CHANGELOG.md are bumped in the staging -> main
# release PR with `npm run release:prepare -- --version X.Y.0`.
#
# The logic is nyuchi/.github's reusable-auto-tag.yml.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Versioning policy override. main releases the next minor; a major
          is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

jobs:
  tag:
    # A manual run releases only from main: run on staging, it would tag
    # beta code as a production release.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@924e5b4d0983d31379aedbec02b990793f29c792 # main, 2026-10-04
    with:
      version-command: "node -p \"require('./package.json').version\""
      channel: main
      bump: ${{ inputs.bump || '' }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      create-release: true
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
